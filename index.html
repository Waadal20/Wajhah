<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وجهة | اكتشف وجهتك القادمة داخل السعودية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F5;--ink:#0E2228;--muted:#5A6D72;--card:#fff;--line:#DCE4E2;--sea:#17707A;--gold:#D9A441;--tile:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081418;--ink:#E8F0EE;--muted:#9DB2B5;--card:#102329;--line:#213840;--sea:#4FB3BE;--tile:#102329}}
:root[data-theme="dark"]{--bg:#081418;--ink:#E8F0EE;--muted:#9DB2B5;--card:#102329;--line:#213840;--sea:#4FB3BE;--tile:#102329}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",sans-serif;line-height:1.8}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
/* hero */
.hero{position:relative;min-height:86vh;min-height:86svh;background:linear-gradient(180deg,#07161C 0%,#0F3A44 55%,#1B5B60 100%);color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:72px 24px 200px}
.hero .in{max-width:900px;margin:0 auto;width:100%;position:relative;z-index:3}
.hero h1{font-size:clamp(88px,26vw,200px);font-weight:700;line-height:.95;margin:0 0 20px}
.hero p{font-size:clamp(18px,3.4vw,26px);font-weight:300;max-width:20em;margin:0 0 32px;color:#D6E6E6}
.cta{background:var(--gold);color:#10252B;border:0;border-radius:999px;font-weight:700;font-size:18px;padding:14px 36px}
.sun{position:absolute;z-index:1;width:min(46vw,300px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 50%,#FFE2A0,#E9B24A 60%,#D9A441);box-shadow:0 0 120px 30px rgba(233,178,74,.35);left:12%;bottom:90px;animation:rise 2.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(140px);opacity:0}to{transform:none;opacity:1}}
.dunes{position:absolute;z-index:2;bottom:-1px;left:0;width:100%;height:210px}
.stats{display:flex;gap:36px;margin-top:44px;font-size:15px;color:#BFD6D6;flex-wrap:wrap}
.stats b{display:block;font-size:28px;color:#fff;line-height:1.2}
/* wizard */
main{max-width:820px;margin:0 auto;padding:56px 20px 40px}
.wiz{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:32px 24px;box-shadow:0 30px 60px -30px rgba(10,40,50,.35)}
.prog{display:flex;gap:8px;margin-bottom:28px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--gold)}
.wiz h2{font-size:clamp(24px,5vw,32px);margin:0 0 6px}
.hint{color:var(--muted);margin:0 0 22px;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{background:var(--tile);color:var(--ink);border:1.5px solid var(--line);border-radius:18px;padding:16px 12px;text-align:center;font-size:17px;min-height:76px;display:flex;align-items:center;justify-content:center;transition:transform .15s,border-color .15s}
.tile span{display:block;font-size:30px;line-height:1.3}
.tile:hover{border-color:var(--sea)}
.tile[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(160deg,rgba(217,164,65,.22),rgba(217,164,65,.06));font-weight:600;transform:translateY(-2px)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px}
.btn{border:0;border-radius:999px;padding:12px 30px;font-weight:600;font-size:17px;background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);padding:12px 6px;font-size:16px}
/* results */
#res{margin-top:56px}
#res>h2{font-size:clamp(26px,6vw,38px);margin:0 0 20px}
.hero-card{border-radius:28px;color:#fff;padding:36px 28px;position:relative;overflow:hidden}
.hero-card .tag{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 16px;font-size:14px}
.hero-card h3{font-size:clamp(44px,12vw,76px);line-height:1.1;margin:14px 0 4px}
.hero-card .reg{opacity:.8}
.hero-card p{max-width:30em;font-size:18px;margin:14px 0}
.ring{position:absolute;top:28px;left:24px;width:96px;height:96px}
.ring text{fill:#fff;font-family:inherit;font-weight:700;font-size:23px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chips span{border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:0 12px;font-size:14px}
.hl{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:4px}
.hl li{padding-right:18px;position:relative}
.hl li:before{content:"";position:absolute;right:0;top:.8em;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:640px){.pair{grid-template-columns:1fr}.ring{width:76px;height:76px;top:20px;left:18px}.ring text{font-size:26px}}
.small{border-radius:22px;color:#fff;padding:24px 22px;position:relative}
.small h3{margin:0;font-size:30px}
.small .pct{position:absolute;top:22px;left:20px;font-weight:700;font-size:24px}
.small p{margin:8px 0;font-size:15px;opacity:.95}
.more{margin-top:32px}
.more h4{margin:0 0 8px;font-size:18px}
.more li{list-style:none;display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.more ul{margin:0;padding:0}
.again{margin-top:28px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 20px 48px}
@media(prefers-reduced-motion:reduce){.sun{animation:none}.tile{transition:none}}
</style>
</head>
<body>
<section class="hero">
<div class="sun" aria-hidden="true"></div>
<div class="in">
<h1>وجهة</h1>
<p>رحلتك القادمة داخل السعودية، تُختار لك بحسب ما تحب.</p>
<button class="cta" id="start">ابدأ الاختيار</button>
<div class="stats"><div><b>12</b>وجهة سياحية</div><div><b>7</b>أنماط سفر</div><div><b>4</b>أسئلة فقط</div></div>
</div>
<svg class="dunes" viewBox="0 0 1200 210" preserveAspectRatio="none" aria-hidden="true">
<path d="M0 120 C150 60 280 130 430 90 C600 40 720 120 880 80 C1010 50 1110 90 1200 70 V210 H0Z" fill="#14505A" opacity=".75"/>
<path d="M0 150 C180 100 300 170 500 135 C700 100 820 170 1000 130 C1100 110 1160 130 1200 120 V210 H0Z" fill="#0C323A"/>
<path d="M0 185 C200 150 360 200 560 175 C760 150 940 200 1200 165 V210 H0Z" fill="var(--bg)"/>
</svg>
</section>

<main>
<div class="wiz" id="wiz"></div>
<section id="res" hidden aria-live="polite"></section>
</main>
<footer>الاقتراحات إرشادية، تأكد من المواسم والأسعار والحجوزات قبل السفر.</footer>

<script>
var INT=["تاريخ وآثار","بحر وشواطئ","جبال وطبيعة","مغامرة","هدوء واستجمام","أكل وثقافة محلية","تسوق وترفيه"];
var STEPS=[
{k:"int",q:"وش تحب في رحلتك؟",h:"اختر خيارًا أو أكثر",m:true,o:INT},
{k:"season",q:"متى تبغى تسافر؟",h:"اختياري",o:["شتاء","صيف","ربيع وخريف"]},
{k:"who",q:"مع من تسافر؟",h:"اختياري",o:["لوحدي","مع العائلة","مع الأصدقاء"],lb:["السفر الفردي","رحلات العائلة","رحلات الأصدقاء"]},
{k:"budget",q:"كم ميزانية رحلتك تقريبًا؟",h:"اختياري",o:["اقتصادية","متوسطة","فاخرة"]}
];
// i: history,beach,nature,adventure,relax,food,fun | s: winter,summer,spring-autumn | b: cost 1-3 | w: solo,family,friends
var D=[
{n:"العلا",r:"محافظة العلا، منطقة المدينة المنورة",g:["#C06A30","#4E2615"],i:[3,0,2,2,2,1,1],s:[3,0,3],b:3,w:[2,2,3],t:"واحة بين الجبال الرملية وآثار عمرها آلاف السنين.",h:["الحِجر","جبل الفيل","البلدة القديمة"]},
{n:"جدة",r:"محافظة جدة، منطقة مكة المكرمة",g:["#1E8A92","#0B3550"],i:[2,3,0,1,2,3,3],s:[3,1,2],b:2,w:[2,3,3],t:"عروس البحر الاحمر ونبض الحياة الساحلية, حيث يلتقي عراقة التاريخ بالمعمار العصري والفنون الحية.",h:["جدة التاريخية","الكورنيش","الغوص"]},
{n:"تبوك",r:"مدينة تبوك، منطقة تبوك",g:["#5F72A0","#1B2745"],i:[2,2,3,3,1,1,1],s:[3,0,2],b:1,w:[2,2,3],t:"بوابة الشمال, حيث تعانق الجبال الشاهقة عراقة التاريخ وجمال التضاريس.",h:["جبل اللوز (الثلوج)","وادي الديسة","شرما"]},
{n:"أبها",r:"مدينة أبها، منطقة عسير",g:["#3E9A60","#10392A"],i:[1,0,3,2,3,2,2],s:[1,3,3],b:2,w:[2,3,3],t:"جبال خضراء وضباب وقرى تراثية، وأجواء معتدلة في الصيف.",h:["السودة","رجال ألمع","قرية المفتاحة"]},
{n:"الطائف",r:"محافظة الطائف، منطقة مكة المكرمة",g:["#B84C75","#451830"],i:[1,0,3,1,3,2,2],s:[1,3,3],b:1,w:[1,3,3],t:"مصيف قريب وجو بارد ومزارع ورد وفواكه.",h:["الهدا","الشفا","سوق عكاظ"]},
{n:"الرياض",r:"مدينة الرياض، منطقة الرياض",g:["#C8902F","#46300F"],i:[2,0,1,1,1,3,3],s:[3,0,2],b:2,w:[2,3,3],t:"عاصمة الحداثة والتنوع,حيث يلتقي طموح المستقبل يعراقة التاريخ في قلب المملكة.",h:["الدرعية","البوليفارد","حافة العالم"]},
{n:"الخبر والظهران",r:"محافظتا الخبر والظهران، المنطقة الشرقية",g:["#2C94AE","#0E3548"],i:[1,3,0,1,2,3,3],s:[3,1,3],b:2,w:[1,3,2],t:"عروس الساحل والهدوء العصري, حيث تلتقي فخامة الواجهات البحرية بروعة الحياة اليومية.",h:["كورنيش الخبر","إثراء","نصف القمر"]},
{n:"جازان وفرسان",r:"مدينة جازان ومحافظة فرسان، منطقة جازان",g:["#22A89A","#0A4546"],i:[1,3,2,2,3,2,0],s:[3,1,3],b:1,w:[2,2,3],t:"جزر ومرجان وجبال خضراء في مكان واحد.",h:["جزر فرسان","وادي لجب","فيفا"]},
{n:"ينبع",r:"محافظة ينبع، منطقة المدينة المنورة",g:["#2C74B8","#0D2D55"],i:[1,3,1,2,2,2,1],s:[3,1,3],b:1,w:[2,3,3],t:"بحر أحمر هادئ وغوص وسواحل.",h:["الغوص","ينبع القديمة","الشواطئ"]},
{n:"الباحة",r:"مدينة الباحة، منطقة الباحة",g:["#648F40","#22391A"],i:[1,0,3,2,3,1,0],s:[0,3,2],b:1,w:[2,3,2],t:"غابات وقرى حجرية وجو لطيف في الصيف.",h:["غابة رغدان","ذي عين"]},
{n:"حائل",r:"مدينة حائل، منطقة حائل",g:["#A96A3E","#3C2013"],i:[2,0,2,3,1,2,1],s:[3,0,3],b:1,w:[2,2,3],t:"جبال أجا وسلمى ونقوش صخرية وتخييم وسط الصحراء.",h:["جبة","جبل أجا","التخييم"]},
{n:"الأحساء",r:"محافظة الأحساء، المنطقة الشرقية",g:["#7F9430","#2E3A0F"],i:[3,0,1,0,2,3,1],s:[3,0,3],b:1,w:[2,3,2],t:"أكبر واحة نخيل قائمة بذاتها في العالم وتراث مسجل في اليونسكو .",h:["واحة الأحساء","جبل القارة","عين نجم"]}
];
var sel={int:[],season:-1,who:-1,budget:-1},step=0,wiz=document.getElementById("wiz");
function render(){
  var S=STEPS[step],h='<div class="prog">'+STEPS.map(function(_,k){return'<i class="'+(k<=step?"on":"")+'"></i>'}).join("")+'</div><h2>'+S.q+'</h2><p class="hint">'+S.h+'</p><div class="tiles">';
  S.o.forEach(function(t,k){
    var on=S.m?sel.int.indexOf(k)>=0:sel[S.k]===k;
    h+='<button type="button" class="tile" data-k="'+k+'" aria-pressed="'+on+'">'+t+'</button>';
  });
  h+='</div><div class="nav"><div>'+(step>0?'<button class="link" id="back">رجوع</button>':'')+'</div><div>'+(step>0?'<button class="link" id="skip">تخطي</button> ':'')+'<button class="btn" id="next">'+(step===STEPS.length-1?"اعرض وجهتي":"التالي")+'</button></div></div>';
  wiz.innerHTML=h;
  var nx=document.getElementById("next");nx.disabled=step===0&&!sel.int.length;
  [].forEach.call(wiz.querySelectorAll(".tile"),function(b){b.onclick=function(){
    var k=+b.dataset.k;
    if(S.m){var p=sel.int.indexOf(k);p<0?sel.int.push(k):sel.int.splice(p,1)}
    else sel[S.k]=sel[S.k]===k?-1:k;
    render();
  }});
  nx.onclick=function(){step<STEPS.length-1?(step++,render()):show()};
  var bk=document.getElementById("back");if(bk)bk.onclick=function(){step--;render()};
  var sk=document.getElementById("skip");if(sk)sk.onclick=function(){sel[S.k]=-1;step<STEPS.length-1?(step++,render()):show()};
}
function score(d){
  var a=sel.int.reduce(function(s,k){return s+d.i[k]},0)/(3*sel.int.length);
  var se=sel.season<0?.6:d.s[sel.season]/3, w=sel.who<0?.6:d.w[sel.who]/3;
  var bu=sel.budget<0?1:Math.max(0,1-.5*Math.max(0,d.b-(sel.budget+1)));
  return Math.min(98,Math.round((.55*a+.2*se+.15*w+.1*bu)*100));
}
function why(d){
  var r=[];
  sel.int.forEach(function(k){if(d.i[k]>=2)r.push("يناسب: "+INT[k])});
  if(sel.season>=0&&d.s[sel.season]===3)r.push("موسمه المناسب: "+STEPS[1].o[sel.season]);
  if(sel.who>=0&&d.w[sel.who]===3)r.push("مناسب لـ"+STEPS[2].lb[sel.who]);
  if(sel.budget>=0&&d.b<=sel.budget+1)r.push("ضمن ميزانيتك");
  return r;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function grad(d){return"background:linear-gradient(145deg,"+d.g[0]+","+d.g[1]+")"}
function show(){
  var L=D.map(function(d){return{d:d,p:score(d)}}).sort(function(x,y){return y.p-x.p});
  var t=L[0],C=2*Math.PI*42;
  var h='<h2>وجهتك المناسبة</h2><article class="hero-card" style="'+grad(t.d)+'">'+
  '<svg class="ring" viewBox="0 0 100 100" aria-label="نسبة التوافق '+t.p+'%"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="7"/><circle id="arc" cx="50" cy="50" r="42" fill="none" stroke="#FFD27A" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" data-to="'+C*(1-t.p/100)+'" transform="rotate(-90 50 50)" style="transition:stroke-dashoffset 1.2s ease"/><text x="50" y="58" text-anchor="middle">'+t.p+'%</text></svg>'+
  '<span class="tag">الأنسب لك</span><h3>'+esc(t.d.n)+'</h3><div class="reg">'+esc(t.d.r)+'</div><p>'+esc(t.d.t)+'</p><div class="chips">'+why(t.d).map(function(x){return"<span>"+esc(x)+"</span>"}).join("")+'</div><ul class="hl">'+t.d.h.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul></article><div class="pair">';
  L.slice(1,3).forEach(function(o){h+='<article class="small" style="'+grad(o.d)+'"><span class="pct">'+o.p+'%</span><h3>'+esc(o.d.n)+'</h3><div class="reg" style="opacity:.8;font-size:14px">'+esc(o.d.r)+'</div><p>'+esc(o.d.t)+'</p><p style="opacity:.8;font-size:14px">'+esc(o.d.h.join("، "))+'</p></article>'});
  h+='</div><div class="more"><h4>خيارات أخرى</h4><ul>'+L.slice(3,7).map(function(o){return"<li><span>"+esc(o.d.n)+"</span><span>"+o.p+"%</span></li>"}).join("")+'</ul></div><button class="btn again" id="redo">ابدأ من جديد</button>';
  var res=document.getElementById("res");res.innerHTML=h;res.hidden=false;
  requestAnimationFrame(function(){requestAnimationFrame(function(){var a=document.getElementById("arc");a.style.strokeDashoffset=a.dataset.to})});
  res.scrollIntoView({behavior:"smooth"});
  document.getElementById("redo").onclick=function(){sel={int:[],season:-1,who:-1,budget:-1};step=0;res.hidden=true;render();wiz.scrollIntoView({behavior:"smooth"})};
}
document.getElementById("start").onclick=function(){wiz.scrollIntoView({behavior:"smooth",block:"center"})};
render();
</script>
</body>
</html>
